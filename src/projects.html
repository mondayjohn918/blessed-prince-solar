<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Blessed Prince B. Solar System, Benin City</title>
<meta name="description" content="Photos of solar installations, battery rooms, inverter setups and street lights by Blessed Prince B. Solar System in Benin City.">
<meta name="theme-color" content="#D2302A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Projects | Blessed Prince B. Solar System, Benin City">
<meta property="og:description" content="Photos of solar installations, battery rooms, inverter setups and street lights by Blessed Prince B. Solar System in Benin City.">
<meta property="og:image" content="https://mondayjohn918.github.io/blessed-prince-solar/og.jpg">
<meta property="og:url" content="https://mondayjohn918.github.io/blessed-prince-solar/projects.html">
<meta property="og:type" content="website">
<link rel="canonical" href="https://mondayjohn918.github.io/blessed-prince-solar/projects.html">
<link rel="preload" href="fonts/cabinet-grotesk-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cabinet-grotesk-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
{{header}}

<main id="main">
  <section class="page-hero f-ink" aria-labelledby="page-title">
    <h1 id="page-title">real jobs.</h1>
    <p class="lead">Rooftops, battery rooms and inverter walls across Benin City, from our own Google business page. Tap a photo to see it larger.</p>
    <figure class="page-photo shutter"><img src="img/p10-1200.webp" srcset="img/p10-640.webp 640w, img/p10-1200.webp 1200w" sizes="(max-width: 760px) 54vw, 24vw" width="1200" height="1189" alt="Six inverters above a large battery bank"></figure>
  </section>

  <section class="gallery-wrap f-paper" aria-labelledby="gal-title">
    <h2 class="sr-only" id="gal-title">Project photos</h2>
    <div class="filters" role="group" aria-label="Filter projects" data-in>
      <button type="button" data-filter="all" aria-pressed="true">all</button>
      <button type="button" data-filter="home" aria-pressed="false">home systems</button>
      <button type="button" data-filter="lithium" aria-pressed="false">lithium</button>
      <button type="button" data-filter="bank" aria-pressed="false">battery banks</button>
      <button type="button" data-filter="roof" aria-pressed="false">panels</button>
      <button type="button" data-filter="street" aria-pressed="false">street lights</button>
      <button type="button" data-filter="parts" aria-pressed="false">products and shop</button>
    </div>
    <p id="filter-status" class="sr-only" aria-live="polite"></p>
    <div class="gallery" data-in>
        <button type="button" data-cat="roof" data-full="img/p18-1200.webp"><img src="img/p18-640.webp" width="640" height="853" alt="Installing panels on a stone-coated roof"><span>Installing panels on a stone-coated roof</span></button>
        <button type="button" data-cat="roof" data-full="img/p05-1200.webp"><img src="img/p05-640.webp" width="640" height="854" alt="Raised panel frame on a flat roof"><span>Raised panel frame on a flat roof</span></button>
        <button type="button" data-cat="bank" data-full="img/p10-1200.webp"><img src="img/p10-640.webp" width="640" height="634" alt="Six inverters and a full battery room"><span>Six inverters and a full battery room</span></button>
        <button type="button" data-cat="bank" data-full="img/p08-1200.webp"><img src="img/p08-640.webp" width="640" height="480" alt="Two inverters over a three-row battery bank"><span>Two inverters over a three-row battery bank</span></button>
        <button type="button" data-cat="street" data-full="img/p15-1200.webp"><img src="img/p15-640.webp" width="640" height="853" alt="Solar street light at dusk"><span>Solar street light at dusk</span></button>
        <button type="button" data-cat="home" data-full="img/p02-1200.webp"><img src="img/p02-640.webp" width="640" height="1138" alt="Twin inverters above tubular batteries"><span>Twin inverters above tubular batteries</span></button>
        <button type="button" data-cat="home lithium" data-full="img/p16-1200.webp"><img src="img/p16-640.webp" width="640" height="853" alt="Wall-mounted lithium with inverter" loading="lazy"><span>Wall-mounted lithium with inverter</span></button>
        <button type="button" data-cat="home lithium" data-full="img/p19-1200.webp"><img src="img/p19-640.webp" width="640" height="852" alt="Two inverters and a lithium stack" loading="lazy"><span>Two inverters and a lithium stack</span></button>
        <button type="button" data-cat="home" data-full="img/p11-1200.webp"><img src="img/p11-640.webp" width="640" height="853" alt="Inverter and batteries in a wooden cabinet" loading="lazy"><span>Inverter and batteries in a wooden cabinet</span></button>
        <button type="button" data-cat="home" data-full="img/p12-1200.webp"><img src="img/p12-640.webp" width="640" height="480" alt="Starter inverter with a tubular battery" loading="lazy"><span>Starter inverter with a tubular battery</span></button>
        <button type="button" data-cat="home" data-full="img/p22-1200.webp"><img src="img/p22-640.webp" width="640" height="640" alt="Multi-inverter wall with charge control" loading="lazy"><span>Multi-inverter wall with charge control</span></button>
        <button type="button" data-cat="home" data-full="img/p23-1200.webp"><img src="img/p23-640.webp" width="640" height="853" alt="Lithium battery set beside a blue door" loading="lazy"><span>Lithium battery set beside a blue door</span></button>
        <button type="button" data-cat="home" data-full="img/p26-1200.webp"><img src="img/p26-640.webp" width="640" height="853" alt="Inverter with green tubular batteries on a rack" loading="lazy"><span>Inverter with green tubular batteries on a rack</span></button>
        <button type="button" data-cat="home" data-full="img/p04-1200.webp"><img src="img/p04-640.webp" width="640" height="989" alt="Inverter on a steel battery stand" loading="lazy"><span>Inverter on a steel battery stand</span></button>
        <button type="button" data-cat="home" data-full="img/p17-1200.webp"><img src="img/p17-640.webp" width="640" height="853" alt="Inverter over a green battery rack" loading="lazy"><span>Inverter over a green battery rack</span></button>
        <button type="button" data-cat="bank" data-full="img/p14-1200.webp"><img src="img/p14-640.webp" width="640" height="873" alt="Inverter above a blue battery bank" loading="lazy"><span>Inverter above a blue battery bank</span></button>
        <button type="button" data-cat="home" data-full="img/p20-1200.webp"><img src="img/p20-640.webp" width="640" height="948" alt="Two inverters on a steel rack" loading="lazy"><span>Two inverters on a steel rack</span></button>
        <button type="button" data-cat="home" data-full="img/p21-1200.webp"><img src="img/p21-640.webp" width="640" height="853" alt="Inverter on a compact battery rack" loading="lazy"><span>Inverter on a compact battery rack</span></button>
        <button type="button" data-cat="home" data-full="img/p01-1200.webp"><img src="img/p01-640.webp" width="640" height="360" alt="Hybrid inverter wall with battery bank" loading="lazy"><span>Hybrid inverter wall with battery bank</span></button>
        <button type="button" data-cat="parts" data-full="img/p24-1200.webp"><img src="img/p24-640.webp" width="640" height="640" alt="Charge controller and surge protection" loading="lazy"><span>Charge controller and surge protection</span></button>
        <button type="button" data-cat="parts" data-full="img/p09-1200.webp"><img src="img/p09-640.webp" width="640" height="853" alt="Portable solar generator" loading="lazy"><span>Portable solar generator</span></button>
        <button type="button" data-cat="home" data-full="img/p03-1200.webp"><img src="img/p03-640.webp" width="640" height="1387" alt="Compact wall inverter with battery stand" loading="lazy"><span>Compact wall inverter with battery stand</span></button>
        <button type="button" data-cat="home" data-full="img/p25-1200.webp"><img src="img/p25-640.webp" width="640" height="853" alt="Small setup tucked beside the door" loading="lazy"><span>Small setup tucked beside the door</span></button>
        <button type="button" data-cat="home" data-full="img/p27-1200.webp"><img src="img/p27-640.webp" width="640" height="640" alt="Inverter and green batteries in a hallway" loading="lazy"><span>Inverter and green batteries in a hallway</span></button>
        <button type="button" data-cat="parts" data-full="img/p07-1200.webp"><img src="img/p07-640.webp" width="640" height="295" alt="Our shop on Akpakpava Road" loading="lazy"><span>Our shop on Akpakpava Road</span></button>
    </div>
  </section>

  <dialog class="lightbox" id="lightbox" aria-label="Project photo">
    <figure><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt=""><figcaption></figcaption></figure>
    <div class="lb-bar">
      <button type="button" data-lb="prev">previous</button>
      <button type="button" data-lb="close">close</button>
      <button type="button" data-lb="next">next</button>
    </div>
  </dialog>
</main>

{{footer}}
</body>
</html>
